<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 터진 게시물</title>

<link rel="stylesheet" href="style.css?v=20261023-production-filter">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div>
      <h1>🔥 오늘의 터진 게시물</h1>
      <p class="sub" id="meta">데이터를 불러오는 중…</p>
    </div>
    <div class="top-right main-navigation">
      <div class="notification-anchor collection-notifications" id="collection-notifications">
        <button type="button" class="icon-button notification-bell" id="collection-notification-toggle" title="수집 알림" aria-label="수집 알림" aria-haspopup="dialog" aria-expanded="false" aria-controls="collection-notification-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></svg><span class="notification-badge" id="collection-notification-count" hidden>1</span></button>
        <section class="notification-panel collection-notification-panel" id="collection-notification-panel" role="dialog" aria-labelledby="collection-notification-title" hidden>
          <div class="notification-head"><h2 id="collection-notification-title">수집 알림</h2><button type="button" class="icon-button" id="collection-notification-close" aria-label="수집 알림 닫기">×</button></div>
          <p id="collection-notification-loading" class="hint" role="status">수집 상태를 불러오는 중…</p>
          <div id="collection-health" hidden></div>
        </section>
      </div>
      <span class="badge" id="source-badge"></span>
      <a class="btn ghost" href="accounts.html">👥 레퍼런스 계정</a>
      <a class="btn ghost" href="settings.html">설정</a>
      <button class="btn ghost" id="theme-toggle" title="테마 전환">🌙</button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <div id="banner" class="banner" hidden></div>

  <section class="stats" id="stats" aria-label="한국 시간 기준 오늘 처음 감지한 터진 게시물 통계"></section>
  <div class="discovery-overview">
  <section class="topic-panel" aria-labelledby="topics-title">
    <div class="section-head">
      <h2 id="topics-title">오늘의 핫 주제</h2>
      <p class="hint">관심 주제를 누르면 영상만 모아볼 수 있어요.</p>
    </div>
    <div class="chips" id="topics"></div>
  </section>
  <aside id="current-settings" class="discovery-summary" aria-label="현재 설정"></aside>
  </div>

  <section class="section">
    <div class="production-filters" role="group" aria-label="영상 제작 상태 필터">
      <button type="button" data-production-filter="all" aria-pressed="true">전체 보기</button>
      <button type="button" data-production-filter="completed" aria-pressed="false">완성</button>
      <button type="button" data-production-filter="working" aria-pressed="false">제작 중</button>
    </div>
    <div class="section-head listing-heading">
      <h2>터진 게시물</h2>
      <div class="compact-search"><button class="icon-button" id="search-toggle" aria-label="검색창 열기" aria-expanded="false" aria-controls="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><div id="search-box" hidden><input id="q" type="search" aria-label="게시물 검색" placeholder="캡션·해시태그 검색"></div></div></div>
    <div class="grid" id="cards"></div>
    <div class="empty" id="empty" hidden></div>
  </section>

</main>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="닫기">✕</button>
    <div id="modal-body"></div>
  </div>
</div>
